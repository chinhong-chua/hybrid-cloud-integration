name: Terraform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Compare against this reviewed commit/ref (default: previous commit)'
        required: true
        default: 'HEAD^'
        type: string

permissions:
  contents: read

# Serialise deployments so two runs cannot apply concurrently.
concurrency:
  group: terraform-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'dev' }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VERSION: '1.16.4'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - name: Validate Terraform
        run: |
          terraform -chdir=infra init -backend=false -lockfile=readonly
          terraform -chdir=infra validate
      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.64.0
      - name: Static analysis
        run: tflint --recursive --config="${GITHUB_WORKSPACE}/.tflint.hcl"

  risk_check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install source parser
        run: python3 -m pip install -r drift-detector/requirements.txt
      - name: Test risk rules
        run: python3 -m unittest discover -s drift-detector -p 'test_*.py' -v
      - name: Assess source changes before plan
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref || 'HEAD^' }}
          HEAD_REV: ${{ github.sha }}
        run: >-
          python3 drift-detector/detector.py
          --base "$BASE_REV" --head "$HEAD_REV"
          --output drift-detector/output/risk-report.json
      - name: Save risk report even when blocked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: configuration-risk-${{ github.run_attempt }}
          path: drift-detector/output/risk-report.json
          retention-days: 1
          if-no-files-found: warn

  plan:
    needs: [checks, risk_check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      deployments: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_bucket_name: ${{ vars.INGESTION_BUCKET_NAME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: dev
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Verify required reviewer is configured
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/dev" \
            | jq -e '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length > 0'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Save binary and readable plans
        run: |
          terraform plan -lock-timeout=5m -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-plan-${{ github.run_attempt }}
          path: |
            infra/tfplan
            infra/plan.txt
          retention-days: 1
          if-no-files-found: error

  apply:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers and a main-only branch rule in GitHub Settings.
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: terraform-plan-${{ github.run_attempt }}
          path: infra
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"
      - name: Apply the reviewed plan
        run: terraform apply -lock-timeout=5m tfplan
